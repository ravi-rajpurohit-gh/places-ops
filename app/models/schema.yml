version: 2

models:
  - name: stg_projects
    description: "Staging model for construction and corporate operations projects."
    columns:
      - name: project_id
        description: "Primary key for projects."
        tests:
          - unique
          - not_null
      - name: project_name
        description: "Name of the facility upgrade or construction project."
      - name: campus
        description: "Operating region or business area where the project is located."
      - name: budget_allocated
        description: "Approved budget allocated to the project."
      - name: status
        description: "Current status of the construction project."
        tests:
          - accepted_values:
              values: ["In Progress", "Completed", "Delayed"]

  - name: stg_vendors
    description: "Contractor and vendor reliability dimension."
    columns:
      - name: vendor_id
        description: "Primary key for the vendor."
        tests:
          - unique
          - not_null
      - name: vendor_name
        description: "The name of the contracted vendor."
      - name: reliability_score
        description: "Internal scoring metric (0-100) assessing vendor performance."

  - name: stg_expenses
    description: "Raw daily capital expenditure records tracking individual vendor payments."
    columns:
      - name: expense_id
        description: "Primary key for the expense line item."
        tests:
          - unique
          - not_null
      - name: amount
        description: "Dollar amount of the logged expense."
      - name: category
        description: "Type of expense (e.g., Materials, Labor, Permits)."

  - name: fct_project_spend
    description: "Core fact table joining daily expenses with project and vendor dimensions for downstream dashboarding."
    columns:
      - name: expense_id
        description: "Primary key."
        tests:
          - unique
          - not_null
      - name: expense_date
        description: "Date when the expense was posted."
      - name: amount
        description: "Capital spent on this specific expense line."
        tests:
          - not_null
      - name: category
        description: "Spend category for the expense line, such as materials, labor, equipment, or permits."
      - name: project_name
        description: "Project associated with the expense line."
      - name: campus
        description: "The operating region or business area where the project is located."
      - name: status
        description: "Current project delivery status at the time the mart is built."
      - name: budget_allocated
        description: "Approved budget for the associated project."
      - name: vendor_name
        description: "Vendor or contractor associated with the expense line."
      - name: reliability_score
        description: "Vendor reliability score used for procurement and project risk review."
