name: dbt CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dbt-ci.yml"
      - "app/models/**"
      - "app/macros/**"
      - "app/snapshots/**"
      - "app/tests/**"
      - "app/dbt_project.yml"
      - "app/profiles.yml"
      - "app/requirements.txt"
      - "generate_mock_data.py"
  pull_request:
    paths:
      - ".github/workflows/dbt-ci.yml"
      - "app/models/**"
      - "app/macros/**"
      - "app/snapshots/**"
      - "app/tests/**"
      - "app/dbt_project.yml"
      - "app/profiles.yml"
      - "app/requirements.txt"
      - "generate_mock_data.py"
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic source data
        working-directory: .
        run: python generate_mock_data.py --seed 42 --as-of-date 2026-06-10

      - name: Validate dbt project
        run: dbt parse --profiles-dir . --no-partial-parse

      - name: Build and test dbt DAG
        run: dbt build --profiles-dir .
